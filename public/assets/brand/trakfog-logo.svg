<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 330" role="img" aria-labelledby="title desc">
<title id="title">TrakFog</title>
<desc id="desc">TrakFog wordmark with radar, location pin, glowing road and fog.</desc>
<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#63dcff"/><stop offset=".5" stop-color="#16a5ff"/><stop offset="1" stop-color="#2467ff"/>
  </linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c6d8f5"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
