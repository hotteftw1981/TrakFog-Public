<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">TrakFog Icon</title>
<desc id="desc">A blue radar and location pin above a glowing road emerging from fog.</desc>
<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#61d8ff"/>
    <stop offset=".48" stop-color="#159cff"/>
    <stop offset="1" stop-color="#2169ff"/>
  </linearGradient>
  <linearGradient id="road" x1=".2" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#0b1a32"/>
    <stop offset="1" stop-color="#020913"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
