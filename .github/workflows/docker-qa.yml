      - name: Check data migration runtime
        shell: bash
        run: |
          set -euo pipefail
          docker exec trakfog-web php -l /var/www/html/src/DataMigrationService.php
          docker exec trakfog-web php -l /var/www/html/public/migration.php
          docker exec trakfog-web php -l /var/www/html/bin/data-migration-worker.php
          docker exec trakfog-web sh -lc 'command -v pg_restore >/dev/null && command -v nohup >/dev/null && php -m | grep -Eqi "^zip$"'
          TABLE_OK="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SHOW TABLES LIKE 'data_migration_jobs';")"
          test "$TABLE_OK" = "data_migration_jobs"

          EXPORT_JOB="$(docker exec trakfog-web php -r '
            require "/var/www/html/src/bootstrap.php";
            $job = DataMigrationService::createExportJob($pdo, 1);
            echo (int)$job["id"];
          ')"
          test -n "$EXPORT_JOB"

          EXPORT_STATUS=""
          for i in $(seq 1 60); do
            EXPORT_STATUS="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT status FROM data_migration_jobs WHERE id=$EXPORT_JOB;")"
            if [ "$EXPORT_STATUS" = "completed" ]; then break; fi
            if [ "$EXPORT_STATUS" = "failed" ]; then
              docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT error_message FROM data_migration_jobs WHERE id=$EXPORT_JOB;"
              exit 1
            fi
            sleep 1
          done
          test "$EXPORT_STATUS" = "completed"

          docker exec trakfog-web php -r '
            require "/var/www/html/src/bootstrap.php";
            $id = (int)$argv[1];
            $job = DataMigrationService::job($pdo, $id);
            if (!$job || !DataMigrationService::canDownload($job)) {
                throw new RuntimeException("Portable export was not created");
            }
            $zip = new ZipArchive();
            if ($zip->open((string)$job["result_path"]) !== true) {
                throw new RuntimeException("Portable export ZIP is invalid");
            }
            $manifest = json_decode((string)$zip->getFromName("manifest.json"), true);
            $zip->close();
            if (($manifest["format"] ?? null) !== "trakfog-data-export") {
                throw new RuntimeException("Portable export manifest is invalid");
            }
            echo "portable export: ok\n";
          ' -- "$EXPORT_JOB"

          BEFORE_COUNTS="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT (SELECT COUNT(*) FROM vehicles),(SELECT COUNT(*) FROM trips),(SELECT COUNT(*) FROM vehicle_stream_samples),(SELECT COUNT(*) FROM charges);")"

          REIMPORT_JOB="$(docker exec trakfog-web php -r '
            require "/var/www/html/src/bootstrap.php";
            $exportId = (int)$argv[1];
            $export = DataMigrationService::job($pdo, $exportId);
            $source = (string)($export["result_path"] ?? "");
            if ($source === "" || !is_file($source)) {
              throw new RuntimeException("Export source missing for re-import");
            }
            $tmp = "/tmp/trakfog-reimport.zip";
            if (!copy($source, $tmp)) {
              throw new RuntimeException("Could not stage portable export for re-import");
            }
            $file = [
              "error" => UPLOAD_ERR_OK,
              "tmp_name" => $tmp,
              "size" => filesize($tmp),
              "name" => "TrakFog-Portable.zip",
            ];
            $job = DataMigrationService::createImportJob($pdo, $file, 1);
            if (($job["source"] ?? null) !== "trakfog") {
              throw new RuntimeException("Portable TrakFog export was not detected");
            }
            DataMigrationService::startImport($pdo, (int)$job["id"]);
            echo (int)$job["id"];
          ' -- "$EXPORT_JOB")"

          REIMPORT_STATUS=""
          for i in $(seq 1 60); do
            REIMPORT_STATUS="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT status FROM data_migration_jobs WHERE id=$REIMPORT_JOB;")"
            if [ "$REIMPORT_STATUS" = "completed" ]; then break; fi
            if [ "$REIMPORT_STATUS" = "failed" ]; then
              docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT error_message FROM data_migration_jobs WHERE id=$REIMPORT_JOB;"
              docker exec trakfog-web sh -lc "cat /var/lib/trakfog/migrations/logs/job-$REIMPORT_JOB.log || true"
              exit 1
            fi
            sleep 1
          done
          test "$REIMPORT_STATUS" = "completed"

          AFTER_COUNTS="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT (SELECT COUNT(*) FROM vehicles),(SELECT COUNT(*) FROM trips),(SELECT COUNT(*) FROM vehicle_stream_samples),(SELECT COUNT(*) FROM charges);")"
          test "$AFTER_COUNTS" = "$BEFORE_COUNTS"
          echo "portable TrakFog re-import duplicate protection: ok"

      - name: Test browser-first fresh install path
        shell: bash
        run: |
          set -euo pipefail
          SETUP_DB="trakfog_setup_qa"
          docker exec trakfog-db mariadb -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" -e "
            DROP DATABASE IF EXISTS $SETUP_DB;
            CREATE DATABASE $SETUP_DB CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON $SETUP_DB.* TO '$TRAKFOG_DB_USER'@'%';
            FLUSH PRIVILEGES;
          "

          docker exec             -e TRAKFOG_DB_NAME="$SETUP_DB"             -e TRAKFOG_OWNER_USER="admin"             -e TRAKFOG_OWNER_EMAIL=""             -e TRAKFOG_OWNER_PASSWORD=""             trakfog-web php /var/www/html/bin/docker-bootstrap.php             | tee /tmp/trakfog-setup-bootstrap.log

          grep -Fq "Waiting for first-run web setup" /tmp/trakfog-setup-bootstrap.log
          test "$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$SETUP_DB" -e "SELECT COUNT(*) FROM users;")" = "0"
          test "$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$SETUP_DB" -e "SELECT setting_value FROM settings WHERE setting_key='setup_completed';")" = "0"

          docker exec -e TRAKFOG_DB_NAME="$SETUP_DB" trakfog-web php -r '
            require "/var/www/html/src/bootstrap.php";
            if (SetupService::userCount($pdo) !== 0 || SetupService::completed($pdo)) {
                throw new RuntimeException("Fresh setup state invalid");
            }
            $validKey=trim((string)file_get_contents("/var/lib/trakfog/setup_token"));
            if (strlen($validKey)!==64 || !SetupService::validateSetupToken($validKey)) {
                throw new RuntimeException("Setup key generation or access failed");
            }
            try {
                SetupService::claimOwner($pdo, "qa-invalid", "invalid@example.invalid", "qa-setup-password-123", "qa-setup-password-123", str_repeat("0",64));
                throw new RuntimeException("Invalid setup key accepted!");
            } catch (RuntimeException $err) {
                if (!str_contains($err->getMessage(), "Installationsschlüssel")) {
                    throw $err;
                }
            }
            if (SetupService::userCount($pdo)!==0) {
                throw new RuntimeException("Invalid key unexpectedly created a user");
            }
            $id = SetupService::claimOwner($pdo, "qa-first-owner", "first-owner@example.invalid", "qa-setup-password-123", "qa-setup-password-123", $validKey);
            if ($id <= 0 || SetupService::userCount($pdo) !== 1) {
                throw new RuntimeException("Owner claim failed");
            }
            SetupService::complete($pdo, $id);
            $stmt=$pdo->prepare("SELECT setting_value FROM settings WHERE setting_key=?");
            $stmt->execute(["setup_completed"]);
            if ((string)$stmt->fetchColumn() !== "1") {
                throw new RuntimeException("Setup completion was not persisted");
            }
            echo "browser-first setup: ok\n";
          '

          docker exec trakfog-db mariadb -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" -e "DROP DATABASE IF EXISTS $SETUP_DB;"
          test "$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT setting_value FROM settings WHERE setting_key='setup_completed';")" = "1"
          echo "FIRST-RUN SETUP PATH PASSED"

