      - name: Test Integration API v1
        shell: bash
        run: |
          set -euo pipefail
          docker exec trakfog-web php -l /var/www/html/src/IntegrationApi.php
          docker exec trakfog-web php -l /var/www/html/public/api/v1/index.php

          test "$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SHOW TABLES LIKE 'integration_api_tokens';")" = "integration_api_tokens"
          test "$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SHOW TABLES LIKE 'integration_api_requests';")" = "integration_api_requests"

          API_TOKEN="$(docker exec trakfog-web php -r '
            require "/var/www/html/src/bootstrap.php";
            $created = IntegrationApi::createToken($pdo, "VoltCore QA", 1, [IntegrationApi::SCOPE_VEHICLE_READ], 120);
            echo $created["token"];
          ')"
          [[ "$API_TOKEN" == tfk_* ]]
          TOKEN_HASH="$(printf '%s' "$API_TOKEN" | sha256sum | awk '{print $1}')"
          STORED_HASH="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT token_hash FROM integration_api_tokens WHERE name='VoltCore QA' ORDER BY id DESC LIMIT 1;")"
          test "$TOKEN_HASH" = "$STORED_HASH"
          RAW_MATCHES="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT COUNT(*) FROM integration_api_tokens WHERE token_hash='$API_TOKEN' OR token_prefix='$API_TOKEN';")"
          test "$RAW_MATCHES" = "0"

          UNAUTH_CODE="$(curl -sS -o /tmp/api-unauth.json -w '%{http_code}' http://127.0.0.1:8780/api/v1/vehicles)"
          test "$UNAUTH_CODE" = "401"
          grep -Fq '"error":"missing_token"' /tmp/api-unauth.json

          VEHICLES_JSON="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" http://127.0.0.1:8780/api/v1/vehicles)"
          grep -Fq '"ok":true' <<<"$VEHICLES_JSON"
          grep -Fq '"api_version":1' <<<"$VEHICLES_JSON"
          grep -Fq '"freshness"' <<<"$VEHICLES_JSON"
          grep -Fq '"vin"' <<<"$VEHICLES_JSON"

          VEHICLE_ID="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT id FROM vehicles ORDER BY id LIMIT 1;")"
          test -n "$VEHICLE_ID"
          STATUS_JSON="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" "http://127.0.0.1:8780/api/v1/vehicles/$VEHICLE_ID/status")"
          grep -Fq '"battery":{' <<<"$STATUS_JSON"
          grep -Fq '"soc":' <<<"$STATUS_JSON"
          grep -Fq '"target_soc":' <<<"$STATUS_JSON"
          grep -Fq '"charging":{' <<<"$STATUS_JSON"
          grep -Fq '"odometer_km":' <<<"$STATUS_JSON"
          grep -Fq '"status":"fresh"' <<<"$STATUS_JSON"

          API_TOKEN_ID="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT id FROM integration_api_tokens WHERE name='VoltCore QA' ORDER BY id DESC LIMIT 1;")"
          docker exec trakfog-web php -r '
            require "/var/www/html/src/bootstrap.php";
            IntegrationApi::revokeToken($pdo, (int)$argv[1]);
          ' -- "$API_TOKEN_ID"
          REVOKED_CODE="$(curl -sS -o /tmp/api-revoked.json -w '%{http_code}' -H "Authorization: Bearer $API_TOKEN" http://127.0.0.1:8780/api/v1/vehicles)"
          test "$REVOKED_CODE" = "401"
          grep -Fq '"error":"invalid_token"' /tmp/api-revoked.json

          RATE_TOKEN="$(docker exec trakfog-web php -r '
            require "/var/www/html/src/bootstrap.php";
            $created = IntegrationApi::createToken($pdo, "Rate QA", 1, [IntegrationApi::SCOPE_VEHICLE_READ], 10);
            echo $created["token"];
          ')"
          for i in $(seq 1 10); do
            curl -fsS -H "Authorization: Bearer $RATE_TOKEN" http://127.0.0.1:8780/api/v1/vehicles >/dev/null
          done
          RATE_CODE="$(curl -sS -o /tmp/api-rate.json -w '%{http_code}' -H "Authorization: Bearer $RATE_TOKEN" http://127.0.0.1:8780/api/v1/vehicles)"
          test "$RATE_CODE" = "429"
          grep -Fq '"error":"rate_limited"' /tmp/api-rate.json

          AUDIT_COUNT="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT COUNT(*) FROM integration_api_requests;")"
          test "$AUDIT_COUNT" -ge 4
          echo "INTEGRATION API V1 PASSED"

      - name: Test TeslaMate backup import
        shell: bash
        run: |
          set -euo pipefail

          docker run -d --rm --name trakfog-teslamate-qa \
            -e POSTGRES_PASSWORD=qa \
            -e POSTGRES_DB=teslamate \
            postgres:18-alpine >/dev/null

          trap 'docker rm -f trakfog-teslamate-qa >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 40); do
            if [ "$(docker exec trakfog-teslamate-qa psql -U postgres -d teslamate -Atqc 'SELECT 1' 2>/dev/null || true)" = "1" ]; then
              break
            fi
            sleep 1
          done
          test "$(docker exec trakfog-teslamate-qa psql -U postgres -d teslamate -Atqc 'SELECT 1')" = "1"

          docker exec -i trakfog-teslamate-qa psql -U postgres -d teslamate <<'SQL'
          CREATE TABLE cars (
            id bigint PRIMARY KEY,
            eid bigint,
            vid bigint,
            vin text,
            name text,
            model text
          );
          CREATE TABLE drives (
            id bigint PRIMARY KEY,
            start_date timestamp,
            end_date timestamp,
            start_km double precision,
            end_km double precision,
            distance double precision,
            speed_max double precision,
            car_id bigint
          );
          CREATE TABLE positions (
            id bigint PRIMARY KEY,
            date timestamp,
            latitude double precision,
            longitude double precision,
            speed double precision,
            power double precision,
            odometer double precision,
            ideal_battery_range_km double precision,
            est_battery_range_km double precision,
            rated_battery_range_km double precision,
            battery_level double precision,
            elevation double precision,
            car_id bigint,
            drive_id bigint
          );
          CREATE TABLE addresses (
            id bigint PRIMARY KEY,
            display_name text,
            latitude double precision,
            longitude double precision
          );
          CREATE TABLE geofences (
            id bigint PRIMARY KEY,
            name text,
            latitude double precision,
            longitude double precision,
            radius integer
          );
          CREATE TABLE charging_processes (
            id bigint PRIMARY KEY,
            start_date timestamp,
            end_date timestamp,
            charge_energy_added double precision,
            charge_energy_used double precision,
            start_battery_level integer,
            end_battery_level integer,
            duration_min integer,
            car_id bigint,
            position_id bigint,
            geofence_id bigint,
            address_id bigint,
            cost numeric
          );
          CREATE TABLE charges (
            id bigint PRIMARY KEY,
            date timestamp,
            charger_power double precision,
            charging_process_id bigint
          );
          CREATE TABLE states (
            id bigint PRIMARY KEY,
            state text,
            start_date timestamp,
            end_date timestamp,
            car_id bigint
          );

          INSERT INTO cars VALUES (1,101,201,'QA-TM-VIN-0001','QA TeslaMate','3');
          INSERT INTO drives VALUES (10,'2026-01-05 08:00:00','2026-01-05 08:30:00',10000,10018.4,18.4,91,1);
          INSERT INTO positions VALUES
            (100,'2026-01-05 08:00:00',51.3000,7.4000,0,0,10000,300,295,290,80,210,1,10),
            (101,'2026-01-05 08:10:00',51.3050,7.4050,62,12,10006,295,290,285,78,215,1,10),
            (102,'2026-01-05 08:20:00',51.3100,7.4100,74,15,10013,289,284,279,76,220,1,10),
            (103,'2026-01-05 08:30:00',51.3150,7.4150,0,0,10018.4,284,279,274,74,218,1,10);
          INSERT INTO addresses VALUES (20,'QA TeslaMate Ladeort',51.3200,7.4200);
          INSERT INTO geofences VALUES (30,'QA TeslaMate Zuhause',51.3000,7.4000,55);
          INSERT INTO charging_processes VALUES
            (40,'2026-01-05 18:00:00','2026-01-05 19:00:00',24.5,25.1,40,78,60,1,NULL,30,20,9.80);
          INSERT INTO charges VALUES
            (50,'2026-01-05 18:10:00',11,40),
            (51,'2026-01-05 18:20:00',22,40);
          INSERT INTO states VALUES
            (60,'online','2026-01-05 07:55:00','2026-01-05 08:35:00',1),
            (61,'asleep','2026-01-06 00:00:00','2026-01-06 06:00:00',1);
          SQL

          # Match TeslaMate's documented backup command: plain pg_dump redirected to teslamate.bck.
          docker exec trakfog-teslamate-qa pg_dump -U postgres -d teslamate -f /tmp/teslamate.bck
          docker cp trakfog-teslamate-qa:/tmp/teslamate.bck /tmp/teslamate.bck
          docker cp /tmp/teslamate.bck trakfog-web:/tmp/teslamate.bck

          IMPORT_JOB="$(docker exec trakfog-web php -r '
            require "/var/www/html/src/bootstrap.php";
            $file = [
              "error" => UPLOAD_ERR_OK,
              "tmp_name" => "/tmp/teslamate.bck",
              "size" => filesize("/tmp/teslamate.bck"),
              "name" => "teslamate.bck",
            ];
            $job = DataMigrationService::createImportJob($pdo, $file, 1);
            if (($job["source"] ?? null) !== "teslamate") {
              throw new RuntimeException("TeslaMate backup was not detected");
            }
            $analysis = $job["analysis"] ?? [];
            if (empty($analysis["ready"])) {
              throw new RuntimeException("TeslaMate backup was not marked ready");
            }
            if (($analysis["format"] ?? null) !== "PostgreSQL SQL Dump") {
              throw new RuntimeException("Official plain TeslaMate backup was not detected as SQL dump");
            }
            DataMigrationService::startImport($pdo, (int)$job["id"]);
            echo (int)$job["id"];
          ')"
          test -n "$IMPORT_JOB"

          IMPORT_STATUS=""
          for i in $(seq 1 90); do
            IMPORT_STATUS="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT status FROM data_migration_jobs WHERE id=$IMPORT_JOB;")"
            if [ "$IMPORT_STATUS" = "completed" ]; then break; fi
            if [ "$IMPORT_STATUS" = "failed" ]; then
              docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT error_message FROM data_migration_jobs WHERE id=$IMPORT_JOB;"
              docker exec trakfog-web sh -lc "cat /var/lib/trakfog/migrations/logs/job-$IMPORT_JOB.log || true"
              exit 1
            fi
            sleep 1
          done
          test "$IMPORT_STATUS" = "completed"

          VEHICLE_ID="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT id FROM vehicles WHERE vin='QA-TM-VIN-0001' LIMIT 1;")"
          test -n "$VEHICLE_ID"
          test "$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT COUNT(*) FROM trips WHERE vehicle_id=$VEHICLE_ID AND started_at='2026-01-05 08:00:00';")" = "1"
          test "$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT COUNT(*) FROM vehicle_stream_samples WHERE vehicle_id=$VEHICLE_ID AND recorded_at BETWEEN '2026-01-05 08:00:00' AND '2026-01-05 08:30:00';")" = "4"
          test "$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT COUNT(*) FROM charges WHERE vehicle_id=$VEHICLE_ID AND started_at='2026-01-05 18:00:00';")" = "1"
          test "$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT COUNT(*) FROM sleep_sessions WHERE vehicle_id=$VEHICLE_ID AND started_at='2026-01-06 00:00:00';")" = "1"
          test "$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT COUNT(*) FROM geofences WHERE name='QA TeslaMate Zuhause';")" = "1"
          test "$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT stored_path IS NULL FROM data_migration_jobs WHERE id=$IMPORT_JOB;")" = "1"
          test "$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT cost_currency IS NULL FROM charges WHERE vehicle_id=$VEHICLE_ID AND started_at='2026-01-05 18:00:00';")" = "1"

          echo "TESLAMATE OFFICIAL BACKUP IMPORT PASSED"

      - name: Test ghost-trip filtering and authorized deletion
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_trip_quality.py -v
          python3 -m py_compile worker/trakfog_worker/trip_quality.py worker/trakfog_worker/db.py
          php -l src/TripDeletion.php
          php -l public/trip-delete.php
          php -l src/trip-delete-dialog.php
          node --check public/assets/js/trip-delete.js
          grep -Fq 'Auth::requireAdmin()' public/trip-delete.php
          grep -Fq 'Csrf::validate' public/trip-delete.php
          grep -Fq 'data-trip-delete-id' public/trips.php
          grep -Fq 'data-trip-delete-id' public/trip.php
          grep -Fq 'TRAKFOG_MIN_TRIP_DISTANCE_METERS' docker-compose.yml
          docker exec trakfog-web php /var/www/html/tests/test_trip_deletion.php

      - name: Verify real trip consolidation (two trips become one)
        shell: bash
        run: |
          set -euo pipefail
          test -s database/migrations/0.1.1.63.sql
          php -l src/TripConsolidation.php
          php tests/test_trip_consolidation_rules.php
          node --check public/assets/js/trip-merge-ui.js
          node --check public/assets/js/liveview.js
          node tests/test_trip_merge_ui.cjs
          python3 tests/qa_contracts.py
          grep -Fq 'TripConsolidation::combine' public/trip-merge.php
          ! grep -Fq 'Verbundene Touren' public/trips.php
          docker exec trakfog-web php /var/www/html/tests/test_trip_consolidation.php

      - name: Show stack status
        run: docker compose ps

      - name: Cleanup
        if: always()
        run: docker compose down -v
