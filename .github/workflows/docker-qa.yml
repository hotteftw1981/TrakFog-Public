                  "SELECT id,started_at FROM charges WHERE vehicle_id=%s AND location_name='QA Supercharger Pending' LIMIT 1",
                  (vehicle_id,),
              )
              charge = cur.fetchone()

          session = {
              "session_id": "qa-tesla-history-session",
              "start_at": charge["started_at"].strftime("%Y-%m-%d %H:%M:%S"),
              "end_at": None,
              "location": "QA Tesla Supercharger",
              "energy_kwh": 40.0,
              "cost_amount": 12.34,
              "currency": "EUR",
              "raw": {"qa": True, "fees": [{"feeType": "CHARGING", "totalDue": 12.34}]},
          }
          result = db.sync_tesla_charging_cost(vehicle_id, session)
          assert result == "updated", result
          PY

          SYNC_ROW="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT CONCAT(cost_amount,'|',cost_currency,'|',cost_source,'|',cost_locked,'|',tesla_charge_session_id) FROM charges WHERE location_name='QA Supercharger Pending' LIMIT 1;")"
          test "$SYNC_ROW" = "12.34|EUR|tesla_invoice|1|qa-tesla-history-session"

          MANUAL_SOURCE="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT cost_source FROM charges WHERE cost_source='manual_total' LIMIT 1;")"
          test "$MANUAL_SOURCE" = "manual_total"

      - name: Test update service and startup reconciliation
        shell: bash
        run: |
          set -euo pipefail

          docker exec trakfog-web sh -c 'test -s /var/lib/trakfog/updater_token'

          docker exec trakfog-web php -r '
            require "/var/www/html/src/bootstrap.php";
            $runtime = UpdateService::runtimeState($pdo, $config);
            $updater = $runtime["updater"] ?? [];
            if (empty($updater["available"]) || empty($updater["ready"])) {
              throw new RuntimeException("Docker updater was not reported as ready");
            }
            if (empty($updater["docker_socket_ready"]) || empty($updater["compose_ready"])) {
              throw new RuntimeException("Docker updater preflight is incomplete");
            }
            echo "docker updater status: ok\n";
          '

          docker exec trakfog-db mariadb \
            -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" \
            -e "
              INSERT INTO settings(setting_key,setting_value)
              VALUES(
                'update_latest_release',
                JSON_OBJECT(
                  'version','0.1.1.99',
                  'tag','v0.1.1.99',
                  'name','QA Update',
                  'notes','QA release notes',
                  'published_at',DATE_FORMAT(UTC_TIMESTAMP(),'%Y-%m-%dT%H:%i:%sZ'),
                  'html_url','https://github.com/hotteftw1981/TrakFog-Public/releases/tag/v0.1.1.99',
                  'prerelease',false,
                  'draft',false,
                  'assets',JSON_ARRAY(),
                  'fetched_at',DATE_FORMAT(UTC_TIMESTAMP(),'%Y-%m-%d %H:%i:%s')
                )
              )
              ON DUPLICATE KEY UPDATE setting_value=VALUES(setting_value);

              INSERT INTO settings(setting_key,setting_value)
              VALUES('update_latest_checked_at',DATE_FORMAT(UTC_TIMESTAMP(),'%Y-%m-%d %H:%i:%s'))
              ON DUPLICATE KEY UPDATE setting_value=VALUES(setting_value);
            "

          docker exec trakfog-web php -r '
            require "/var/www/html/src/bootstrap.php";
            $status = UpdateService::status($pdo, $config, false);
            if (($status["latest_version"] ?? null) !== "0.1.1.99") {
              throw new RuntimeException("Cached update version not detected");
            }
            if (empty($status["update_available"])) {
              throw new RuntimeException("Newer cached release not marked as update");
            }
            echo "update status cache: ok\n";
          '

          CURRENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          docker exec trakfog-db mariadb \
            -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" \
            -e "
              INSERT INTO settings(setting_key,setting_value)
              VALUES(
                'update_pending',
                JSON_OBJECT(
                  'from_version','0.1.1.0',
                  'target_version','$CURRENT_VERSION',
                  'release_tag',CONCAT('v','$CURRENT_VERSION'),
                  'requested_at',DATE_FORMAT(UTC_TIMESTAMP(),'%Y-%m-%d %H:%i:%s'),
                  'requested_by',1,
                  'method','docker_updater'
                )
              )
              ON DUPLICATE KEY UPDATE setting_value=VALUES(setting_value);
            "

          docker exec trakfog-web php /var/www/html/bin/docker-bootstrap.php

          PENDING_IS_NULL="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT setting_value IS NULL FROM settings WHERE setting_key='update_pending' LIMIT 1;")"
          test "$PENDING_IS_NULL" = "1"

          UPDATE_STATUS="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT JSON_UNQUOTE(JSON_EXTRACT(setting_value,'$.status')) FROM settings WHERE setting_key='update_last_result' LIMIT 1;")"
          UPDATE_INSTALLED="$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT JSON_UNQUOTE(JSON_EXTRACT(setting_value,'$.installed_version')) FROM settings WHERE setting_key='update_last_result' LIMIT 1;")"

          if [ "$UPDATE_STATUS" != "success" ]; then
            echo "update reconciliation status mismatch: $UPDATE_STATUS"
            exit 1
          fi
          if [ "$UPDATE_INSTALLED" != "$CURRENT_VERSION" ]; then
            echo "update reconciliation version mismatch: got=$UPDATE_INSTALLED expected=$CURRENT_VERSION"
            exit 1
          fi
          echo "update startup reconciliation: ok"

      - name: Authenticated page smoke test
        shell: bash
        run: |
          set -euo pipefail
          COOKIE_JAR="$(mktemp)"
          LOGIN_HTML="$(curl -fsS -c "$COOKIE_JAR" http://127.0.0.1:8780/login.php)"
          CSRF="$(printf '%s' "$LOGIN_HTML" | sed -n 's/.*name="csrf_token" value="\([^"]*\)".*/\1/p' | head -n1)"
          test -n "$CSRF"

          curl -fsS -L             -b "$COOKIE_JAR" -c "$COOKIE_JAR"             --data-urlencode "csrf_token=$CSRF"             --data-urlencode "login=$TRAKFOG_OWNER_USER"             --data-urlencode "password=$TRAKFOG_OWNER_PASSWORD"             http://127.0.0.1:8780/login.php             -o /tmp/trakfog-login-result.html

          for PAGE in app.php drive.php trips.php trip.php?id=1 charges.php charge.php?id=1 statistics.php sleep.php map.php journeys.php journey.php?id=1 live.php system.php migration.php worker.php settings.php diagnostics.php; do
            SAFE_PAGE="$(printf '%s' "$PAGE" | tr '/?=&' '____')"
            CODE="$(curl -sS -b "$COOKIE_JAR" -o "/tmp/$SAFE_PAGE.html" -w '%{http_code}' "http://127.0.0.1:8780/$PAGE")"
            if [ "$CODE" != "200" ]; then
              echo "$PAGE returned HTTP $CODE"
              cat "/tmp/$SAFE_PAGE.html"
              echo "---- TrakFog application log ----"
              docker exec trakfog-web sh -lc 'tail -n 120 /var/www/html/storage/logs/trakfog-*.log 2>/dev/null || true'
              echo "---- Web container log ----"
              docker compose logs --no-color web
              exit 1
            fi
            if grep -q 'class="error-code"' "/tmp/$SAFE_PAGE.html"; then
              echo "$PAGE rendered the TrakFog error page"
              cat "/tmp/$SAFE_PAGE.html"
              echo "---- TrakFog application log ----"
              docker exec trakfog-web sh -lc 'tail -n 120 /var/www/html/storage/logs/trakfog-*.log 2>/dev/null || true'
              echo "---- Web container log ----"
              docker compose logs --no-color web
              exit 1
            fi
          done

          SYSTEM_HTML="$(curl -fsS -b "$COOKIE_JAR" http://127.0.0.1:8780/system.php)"
          DASHBOARD_HTML="$(curl -fsS -b "$COOKIE_JAR" http://127.0.0.1:8780/app.php)"
          assert_html_contains() {
            local label="$1"
            local needle="$2"
            local html="$3"
            if ! grep -Fq "$needle" <<<"$html"; then
              echo "SMOKE ASSERTION FAILED [$label]: missing [$needle]"
              printf '%s\n' "$html" | grep -E -i 'Sleeping|schläft|wartet|Fahrzeugerkennung|System läuft|Datendienst|Tesla' | head -n 80 || true
              exit 1
            fi
            echo "SMOKE ASSERTION OK [$label]: $needle"
          }
          assert_html_contains "system vehicle" "QA Sleeping Tesla" "$SYSTEM_HTML"
          assert_html_contains "system sleep freshness" "schläft / wartet" "$SYSTEM_HTML"
          assert_html_contains "system products warning" "Fahrzeugerkennung eingeschränkt" "$SYSTEM_HTML"
          assert_html_contains "system overall health" "System läuft · Hinweis" "$SYSTEM_HTML"
          assert_html_contains "api diagnostic title" "Letzte Tesla-API-Diagnose" "$SYSTEM_HTML"
          assert_html_contains "api diagnostic endpoint" "/api/1/products" "$SYSTEM_HTML"
          assert_html_contains "api diagnostic transport" "HTTP/2" "$SYSTEM_HTML"
          assert_html_contains "api diagnostic tesla text" "forbidden, see Fleet API" "$SYSTEM_HTML"
          assert_html_contains "api diagnostic txid" "qa-txid-403" "$SYSTEM_HTML"
          assert_html_contains "api diagnostic fallback" "lokale bekannte Fahrzeuge aktiv" "$SYSTEM_HTML"
          assert_html_contains "dashboard vehicle strip" "data-dashboard-vehicle-strip" "$DASHBOARD_HTML"
          assert_html_contains "dashboard vehicle selector" "data-dashboard-vehicle-select" "$DASHBOARD_HTML"
          assert_html_contains "dashboard favorite control" "data-dashboard-favorite" "$DASHBOARD_HTML"
          assert_html_contains "dashboard hero" "data-dashboard-hero" "$DASHBOARD_HTML"
          assert_html_contains "dashboard hero vehicle" "QA Sleeping Tesla" "$DASHBOARD_HTML"
          assert_html_contains "dashboard seeded mode" "mode-online" "$DASHBOARD_HTML"
          assert_html_contains "dashboard secondary stage" "data-secondary-car=\"1\"" "$DASHBOARD_HTML"
          assert_html_contains "dashboard app update" "TrakFog V0.1.1.99 verfügbar" "$DASHBOARD_HTML"
          assert_html_contains "dashboard app update link" "system.php#updates" "$DASHBOARD_HTML"
          test "$(docker exec trakfog-db mariadb -N -uroot -p"$TRAKFOG_DB_ROOT_PASSWORD" "$TRAKFOG_DB_NAME" -e "SELECT setting_value FROM settings WHERE setting_key='setup_completed';")" = "1"
          assert_html_contains "integration api nav" "Integration API" "$SYSTEM_HTML"
          assert_html_contains "integration api endpoint" "/api/v1/vehicles/{id}/status" "$SYSTEM_HTML"
          assert_html_contains "integration api scope" "vehicle:read" "$SYSTEM_HTML"
          assert_html_contains "update center" "⬆ Updates" "$SYSTEM_HTML"
          assert_html_contains "update fixed source" "hotteftw1981/TrakFog-Public 🔒" "$SYSTEM_HTML"
          if grep -Fq 'name="update_repository"' <<<"$SYSTEM_HTML"; then
            echo "SMOKE ASSERTION FAILED [update source lock]: editable repository field rendered"
            exit 1
          fi
          echo "SMOKE ASSERTION OK [update source lock]: official repository is fixed"
          assert_html_contains "update available" "V0.1.1.99" "$SYSTEM_HTML"
          assert_html_contains "update release tag" "v0.1.1.99" "$SYSTEM_HTML"
          assert_html_contains "update docker updater" "Docker-Updater bereit" "$SYSTEM_HTML"
          assert_html_contains "update install modal" "V0.1.1.99 jetzt installieren" "$SYSTEM_HTML"
          assert_html_contains "update success history" "Letztes Update auf V" "$SYSTEM_HTML"
          if grep -Fq "Portainer Stack-Webhook" <<<"$SYSTEM_HTML"; then
            echo "SMOKE ASSERTION FAILED [portainer dependency]: legacy webhook UI rendered"
            exit 1
          fi
          echo "SMOKE ASSERTION OK [portainer dependency]: webhook UI removed"
          if grep -Fq "QA_SHOULD_NEVER_RENDER_ACCESS" <<<"$SYSTEM_HTML" || grep -Fq "QA_SHOULD_NEVER_RENDER_REFRESH" <<<"$SYSTEM_HTML"; then
            echo "SMOKE ASSERTION FAILED [api diagnostic secret leak]: secret value rendered"
            exit 1
          fi
          echo "SMOKE ASSERTION OK [api diagnostic secret leak]: injected secrets hidden"
          echo "SYSTEM FRESHNESS + API DIAGNOSTIC SMOKE PASSED"

          ERROR_CODE="$(curl -sS -b "$COOKIE_JAR" -o /tmp/trakfog-404.html -w '%{http_code}' http://127.0.0.1:8780/definitely-not-a-trakfog-page)"
