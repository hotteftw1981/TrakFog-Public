      - name: Validate runtime HTTP2 and TLS13 support
        shell: bash
        run: |
          set -euo pipefail
          docker exec trakfog-worker python - <<'PY'
          import ssl
          import httpx
          import h2
          assert ssl.HAS_TLSv1_3
          client = httpx.Client(http2=True)
          client.close()

          from types import SimpleNamespace
          from trakfog_worker.tesla import TeslaClient, TeslaError

          class FakeResponse:
              def __init__(self, status_code, payload):
                  self.status_code = status_code
                  self.is_success = 200 <= status_code < 300
                  self.http_version = "HTTP/2"
                  self._payload = payload
              def json(self):
                  return self._payload

          class FakeSession:
              def __init__(self, response):
                  self.response = response
              def request(self, *args, **kwargs):
                  return self.response

          fake = object.__new__(TeslaClient)
          fake.config = SimpleNamespace(tesla_api_host="https://example.invalid")
          fake.ensure_fresh = lambda integration: integration
          fake._tokens = lambda integration: ("qa-access-token", None)

          fake.session = FakeSession(FakeResponse(200, {"response": []}))
          assert fake._request({"id": 1}, "GET", "/api/1/products") == {"response": []}

          fake.session = FakeSession(FakeResponse(403, {
              "error": "forbidden, see Fleet API",
              "error_description": "QA owner-api restriction",
              "txid": "qa-txid-403"
          }))
          try:
              fake._request({"id": 1}, "GET", "/api/1/products", retry_401=False)
              raise AssertionError("403 did not raise TeslaError")
          except TeslaError as exc:
              assert exc.status == 403
              diag = exc.diagnostic()
              assert diag["area"] == "products", diag
              assert diag["endpoint"] == "/api/1/products", diag
              assert diag["tesla_error"] == "forbidden, see Fleet API", diag
              assert diag["error_description"] == "QA owner-api restriction", diag
              assert diag["txid"] == "qa-txid-403", diag
              assert diag["http_version"] == "HTTP/2", diag

          print("worker transport: HTTP/2 client available, TLS1.3 available, structured Tesla error path valid")
          PY

          docker exec trakfog-web php -r '
            if (!defined("CURL_HTTP_VERSION_2TLS")) { fwrite(STDERR, "HTTP/2 constant missing\n"); exit(1); }
            if (!defined("CURL_SSLVERSION_TLSv1_3")) { fwrite(STDERR, "TLS1.3 constant missing\n"); exit(1); }
            $v = curl_version();
            if (($v["features"] & CURL_VERSION_HTTP2) === 0) { fwrite(STDERR, "libcurl HTTP/2 feature missing\n"); exit(1); }
            echo "web transport: HTTP/2 + TLS1.3 configuration available\n";
          '

