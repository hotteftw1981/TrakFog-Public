name: Docker QA

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker-qa.yml"
  workflow_dispatch:

concurrency:
  group: trakfog-docker-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-qa:
    runs-on: ubuntu-latest
    env:
      TRAKFOG_HTTP_PORT: "8780"
      TRAKFOG_TIMEZONE: "Europe/Berlin"
      TRAKFOG_BASE_URL: "http://127.0.0.1:8780"
      TRAKFOG_DB_NAME: "trakfog"
      TRAKFOG_DB_USER: "trakfog"
      TRAKFOG_DB_PASSWORD: "qa-db-password-123456"
      TRAKFOG_DB_ROOT_PASSWORD: "qa-root-password-123456"
      TRAKFOG_OWNER_USER: "qaadmin"
      TRAKFOG_OWNER_EMAIL: "qa@example.invalid"
      TRAKFOG_OWNER_PASSWORD: "qa-owner-password-123456"
      TRAKFOG_WORKER_POLL_ONLINE_SECONDS: "30"
      TRAKFOG_WORKER_POLL_SLEEP_SECONDS: "60"
      TRAKFOG_WORKER_HEARTBEAT_SECONDS: "10"
      TRAKFOG_GEOCODER_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Generate QA app key
        shell: bash
        run: echo "TRAKFOG_APP_KEY=base64:$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Compile Python services
        run: |
          python3 -m compileall -q worker
          python3 -m py_compile docker/updater/updater.py

      - name: Validate Tesla HTTP2 and TLS13 code
        run: |
          grep -q "import httpx" worker/trakfog_worker/tesla.py
          grep -q "http2=True" worker/trakfog_worker/tesla.py
          grep -q "TLSVersion.TLSv1_3" worker/trakfog_worker/tesla.py
          grep -q "httpx\[http2\]" worker/requirements.txt
          grep -q "CURL_HTTP_VERSION_2TLS" src/TeslaConnector.php
          grep -q "CURL_SSLVERSION_TLSv1_3" src/TeslaConnector.php

      - name: Validate Tesla 403 fallback and freshness code
        run: |
          grep -q "without_location" src/TeslaConnector.php
          grep -q "without_location" worker/trakfog_worker/tesla.py
          grep -q "rememberApiIssue" src/TeslaService.php
          grep -q "recoverableTeslaError" public/connect.php
          grep -q "known_vehicle_fallback" worker/trakfog_worker/worker.py
          grep -q "known_tesla_vehicles" worker/trakfog_worker/db.py
          grep -q "tesla_403_refresh_last_at" worker/trakfog_worker/worker.py
          grep -q "products_source" worker/trakfog_worker/worker.py
          grep -q "workerStateBroken" public/system.php
          grep -q "Tesla Fahrzeugerkennung" public/system.php
          grep -q "Tesla Datenfrische" public/system.php
          grep -q "data_freshness" public/live-data.php
          grep -q "Daten veraltet" public/assets/js/liveview.js
          grep -q "last_event_at" public/system.php
          ! grep -q "last_message_at" public/system.php
          ! grep -q "response.ok" worker/trakfog_worker/tesla.py
          grep -q "response.is_success" worker/trakfog_worker/tesla.py
          grep -q "def diagnostic" worker/trakfog_worker/tesla.py
          grep -q "tesla_error" worker/trakfog_worker/tesla.py
          grep -q "http_version" worker/trakfog_worker/tesla.py
          grep -q "tesla_api_last_diagnostic" worker/trakfog_worker/worker.py
          grep -q "tesla_api_last_diagnostic" src/TeslaService.php
          grep -q "system-api-diagnostic" public/system.php
          grep -q "txid / Request-ID" public/system.php
          grep -q "keine Access-/Refresh-Tokens" public/system.php
          grep -q "status='connected'" database/migrations/0.1.1.38.sql
          grep -q "Fahrzeugliste" database/migrations/0.1.1.44.sql
          ! grep -q "Tesla verweigert den Detailabruf" src/TeslaConnector.php
          grep -q "COALESCE(:latitude,latitude)" src/TeslaService.php
          grep -q "latitude=COALESCE(%s,latitude)" worker/trakfog_worker/worker.py

      - name: Validate license
        run: |
          test -f LICENSE
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          grep -q "Version 3, 19 November 2007" LICENSE
          grep -q "AGPL-3.0-only" README.md

      - name: Validate version consistency
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          grep -Fq "x-trakfog-version: \"$VERSION\"" docker-compose.yml
          grep -Fq "**V$VERSION**" README.md
          grep -Fq "<b>V$VERSION</b>" docs/index.html

      - name: Validate TrakFog branding
        shell: bash
        run: |
          set -euo pipefail
          test -s public/assets/brand/trakfog-logo.svg
          test -s public/assets/brand/trakfog-icon.svg
          test -s public/site.webmanifest
          grep -q 'assets/brand/trakfog-icon.svg' src/View.php
          grep -q 'assets/brand/trakfog-logo.svg' src/View.php
          grep -q 'assets/brand/trakfog-logo.svg' public/login.php
          grep -q 'assets/brand/trakfog-logo.svg' public/live.php
          grep -q 'assets/brand/trakfog-icon.svg' public/live.php
          grep -q 'assets/brand/trakfog-logo.svg' src/ErrorPage.php
          grep -q 'site.webmanifest' src/View.php
          grep -q 'site.webmanifest' public/live.php
          grep -q 'application/manifest+json' public/.htaccess
          ! grep -q '<span class="tf-mark">TF</span>' src/View.php public/login.php src/ErrorPage.php
          ! grep -q '<span class="live-mark">TF</span>' public/live.php
          grep -q 'trakfog-logo.svg' README.md
          grep -q 'trakfog-logo.svg' docs/index.html

      - name: Validate TrakFog Info and Credits
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'id="infoToggle"' src/View.php
          grep -Fq 'id="infoModal"' src/View.php
          grep -Fq 'Systeminformationen' src/View.php
          grep -Fq 'Konzeption &amp; Entwicklung' src/View.php
          grep -Fq 'Patrick Garbe' src/View.php
          grep -Fq 'Buddy' src/View.php
          grep -Fq 'AGPL-3.0-only' src/View.php
          grep -Fq 'Projektinitiator &amp; Entwickler' src/View.php
          if grep -RIl \
            --include='*.php' --include='*.js' --include='*.css' --include='*.md' --include='*.html' \
            -E 'DRK Ortsverein Schwelm|DRK-ONE' src public README.md CHANGELOG.md docs | grep -q .; then
            echo "TrakFog contains an unwanted DRK project affiliation."
            exit 1
          fi
          grep -Fq 'href="#info">Info</a>' public/system.php
          grep -Fq 'id="info"' public/system.php
          grep -Fq 'render_trakfog_info_content' public/system.php
          grep -Fq 'data-info-modal-close' src/View.php
          grep -Fq 'setInfoModal' public/assets/js/app.js
          if grep -RIl \
            --include='*.php' --include='*.js' --include='*.css' --include='*.md' --include='*.html' \
            -E 'ChatGPT|OpenAI' src public README.md docs | grep -q .; then
            echo "Visible Community code contains a forbidden ChatGPT/OpenAI credit."
            exit 1
          fi
          echo "TrakFog Info and Credits: ok"

      - name: Validate TrakFog blue brand system
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- '--brand:#159cff;' public/assets/css/app.css
          grep -Fq -- '--brand-strong:#2169ff;' public/assets/css/app.css
          grep -Fq -- '--brand-soft:rgba(21,156,255,.10);' public/assets/css/app.css
          grep -Fq -- '--lv-brand:#159cff;' public/assets/css/liveview.css
          grep -Fq '.login-brand{display:grid;justify-items:center' public/assets/css/app.css
          grep -Fq '.login-brand-logo{display:block;width:min(260px,78%);height:auto;margin:0 auto}' public/assets/css/app.css
          ! grep -Fq -- '--brand:#e82127;' public/assets/css/app.css
          ! grep -Fq -- '--lv-brand:#e82127;' public/assets/css/liveview.css
          grep -Fq -- '--danger:#d92b36;' public/assets/css/app.css
          grep -Fq '.btn-danger' public/assets/css/app.css

      - name: Validate data migration center
        shell: bash
        run: |
          set -euo pipefail
          test -s src/DataMigrationService.php
          test -s bin/data-migration-worker.php
          test -s public/migration.php
          test -s database/migrations/0.1.1.52.sql
          grep -Fq "final class DataMigrationService" src/DataMigrationService.php
          grep -Fq "'teslamate'" src/DataMigrationService.php
          grep -Fq "'teslalogger'" src/DataMigrationService.php
          grep -Fq "'teslafi'" src/DataMigrationService.php
          grep -Fq "'tessie'" src/DataMigrationService.php
          grep -Fq "'teslascope'" src/DataMigrationService.php
          grep -Fq "'tronity'" src/DataMigrationService.php
          grep -Fq "'tezlab'" src/DataMigrationService.php
          grep -Fq "pg_restore" src/DataMigrationService.php
          grep -Fq "'--table=' . \$table" src/DataMigrationService.php
          grep -Fq "parsePgSqlCopyIndex" src/DataMigrationService.php
          grep -Fq "PostgreSQL SQL Dump" src/DataMigrationService.php
          grep -Fq "ZipArchive" src/DataMigrationService.php
          grep -Fq "data_migration_jobs" database/migrations/0.1.1.52.sql
          grep -Fq "postgresql-client" docker/web/Dockerfile
          grep -Fq "docker-php-ext-install pdo_mysql curl zip" docker/web/Dockerfile
          grep -Fq 'href="migration.php"' public/system.php
          grep -Fq 'Datenmigration' public/system.php
          grep -Fq 'Daten mitnehmen. Nicht neu anfangen.' public/migration.php

      - name: Validate Integration API v1
        shell: bash
        run: |
          set -euo pipefail
          test -s src/IntegrationApi.php
          test -s public/api/v1/index.php
          test -s database/migrations/0.1.1.53.sql
          test -s docs/INTEGRATION-API.md
          grep -Fq "final class IntegrationApi" src/IntegrationApi.php
          grep -Fq "SCOPE_VEHICLE_READ = 'vehicle:read'" src/IntegrationApi.php
          grep -Fq "hash('sha256', \$token)" src/IntegrationApi.php
          grep -Fq "rate_limit_per_minute" src/IntegrationApi.php
          grep -Fq "freshness" src/IntegrationApi.php
          grep -Fq "charge_limit_soc" src/IntegrationApi.php
          grep -Fq "integration_api_tokens" database/migrations/0.1.1.53.sql
          grep -Fq "integration_api_requests" database/migrations/0.1.1.53.sql
          ! grep -Fq "access_token_enc" public/api/v1/index.php
          ! grep -Fq "refresh_token_enc" public/api/v1/index.php
          grep -Fq "RewriteRule ^api/v1/vehicles/?$" public/.htaccess
          grep -Fq "vehicle_status" public/.htaccess
          grep -Fq 'href="#integration-api">Integration API</a>' public/system.php
          grep -Fq 'id="integration-api"' public/system.php
          grep -Fq "API-Zugang erstellen" public/system.php
          grep -Fq "Authorization: Bearer tfk_" docs/INTEGRATION-API.md
          grep -Fq "VoltCore" docs/INTEGRATION-API.md

      - name: Validate first-run setup wizard
        shell: bash
        run: |
          set -euo pipefail
          test -s src/SetupService.php
          test -s public/setup.php
          test -s database/migrations/0.1.1.54.sql
          grep -Fq "final class SetupService" src/SetupService.php
          grep -Fq "GET_LOCK" src/SetupService.php
          grep -Fq "claimOwner" src/SetupService.php
          grep -Fq "validateSetupToken" src/SetupService.php
          grep -Fq "setup_token" public/setup.php
          grep -Fq "SETUP_TOKEN_FILE" docker/web/entrypoint.sh
          grep -Fq "setup_completed" database/migrations/0.1.1.54.sql
          grep -Fq "setup.php" public/index.php
          grep -Fq "SetupService::required" public/login.php
          grep -Fq "No owner preconfigured. Waiting for first-run web setup." bin/docker-bootstrap.php
          grep -Fq "TRAKFOG_OWNER_EMAIL=" .env.example
          grep -Fq "Ersteinrichtungsassistenten" docker/PORTAINER.md
          grep -Fq "Ersteinrichtungsassistenten" docker/DOCKER.md
          grep -Fq "TrakFog startklar machen." public/setup.php
          grep -Fq "Historie mitnehmen?" public/setup.php
          grep -Fq "Tesla später verbinden" public/setup.php
          ! grep -Fq "DRK" public/setup.php src/SetupService.php

      - name: Validate adaptive dashboard hero
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data-dashboard-root' public/app.php
          grep -Fq 'data-dashboard-vehicle-select' public/app.php
          grep -Fq 'data-dashboard-favorite' public/app.php
          grep -Fq 'data-dashboard-hero' public/app.php
          grep -Fq 'data-secondary-car="1"' public/app.php
          grep -Fq 'data-secondary-car="2"' public/app.php
          grep -Fq 'dashboard-energy-line' public/app.php
          grep -Fq 'dashboard-car-image' public/app.php
          grep -Fq 'TeslaVehicleArt::asset' public/app.php
          grep -Fq 'data-car-asset' public/app.php
          grep -Fq 'dashboard-thumb-link' public/app.php
          test -s public/assets/vehicles/model-3-white.svg
          test -s public/assets/vehicles/model-s-white.svg
          test -s public/assets/vehicles/model-x-white.svg
          grep -Fq 'TripMerge::suggestionFor' public/live-data.php
          grep -Fq 'data-trip-merge-choice' public/trips.php
          grep -Fq 'lvTripMergeToggle' public/live.php
          grep -Fq 'trip_merge_members' database/migrations/0.1.1.60.sql
          node --check public/assets/js/liveview.js
          php -l src/TripMerge.php
          php -l public/trip-merge.php
          php -l public/trip-group.php
          php tests/test_trip_merge.php
          python3 tests/qa_contracts.py
          grep -Fq 'data-secondary-car="<?= $stackIndex ?>"' public/app.php
          ! grep -Fq 'dashboard-car-svg' public/app.php
          test -s public/assets/vehicles/model-y-white.svg
          test -s public/assets/css/living-garage.css
          test -s public/assets/js/living-garage.js
          grep -Fq 'lg-atmosphere' public/app.php
          grep -Fq 'data-lg-motion="off"' public/app.php
          grep -Fq 'data-lg-motion="subtle"' public/app.php
          grep -Fq 'data-lg-motion="full"' public/app.php
          grep -Fq 'living-garage.css' src/View.php
          grep -Fq 'living-garage.js' src/View.php
          grep -Fq 'trakfog-living-garage-motion' public/assets/js/living-garage.js
          grep -Fq 'prefers-reduced-motion:reduce' public/assets/css/living-garage.css
          node --check public/assets/js/living-garage.js
          grep -Fq "humanTrim" public/app.php
          grep -Fq 'data-hero-icon-d' public/app.php
          grep -Fq 'mode-charging' public/assets/css/app.css
          grep -Fq 'mode-driving' public/assets/css/app.css
          grep -Fq 'mode-sleeping' public/assets/css/app.css
          grep -Fq 'mode-online' public/assets/css/app.css
          grep -Fq 'dashboard-secondary-car' public/assets/css/app.css
          grep -Fq 'dashboard-car-image' public/assets/css/app.css
          grep -Fq 'dashboard-hero.mode-sleeping .dashboard-primary-car' public/assets/css/app.css
          grep -Fq 'trakfog-dashboard-favorite-vehicle' public/assets/js/app.js
          grep -Fq "document.addEventListener('trakfog:live-updated'" public/assets/js/app.js
          grep -Fq "secondaryCandidates" public/assets/js/app.js
          grep -Fq "prefers-reduced-motion" public/assets/css/app.css
          ! grep -Fq 'DRK' public/app.php
          node --check public/assets/js/app.js

      - name: Validate readable trip list and persistent merge workflow
        shell: bash
        run: |
          set -euo pipefail
          test -s public/assets/js/trip-merge-ui.js
          node --check public/assets/js/trip-merge-ui.js
          node tests/test_trip_merge_ui.cjs
          php -l public/trips.php
          php -l public/trip-merge.php
          php -l public/trip-group.php
          grep -Fq 'trip-merge-ui.js' src/View.php
          grep -Fq 'tripMergeSelectedBar' public/trips.php
          grep -Fq 'tripMergeSave' public/trips.php
          grep -Fq 'trip-place-name' public/assets/css/trip-merge.css
          grep -Fq 'Tour erfolgreich gespeichert' public/trip-group.php

      - name: Verify KPI navigation, measured speed and draggable LiveMap
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_kpi_navigation.py
          node tests/test_chart_gaps.cjs
          node --check public/assets/js/charts.js
          node --check public/assets/js/liveview.js
          php -l public/statistics.php
          php -l public/app.php
          php -l public/trips.php
          grep -Fq 'MAX(CASE WHEN speed_kmh BETWEEN 0 AND 350 THEN speed_kmh END)' public/statistics.php
          grep -Fq 'dragging:true' public/assets/js/liveview.js
          grep -Fq 'data-chart' public/statistics.php

      - name: Validate update system code
        run: |
          grep -q "final class UpdateService" src/UpdateService.php
          grep -q "releases/latest" src/UpdateService.php
          grep -q "return self::DEFAULT_REPOSITORY" src/UpdateService.php
          ! grep -q "function saveRepository" src/UpdateService.php
          ! grep -q 'name="update_repository"' public/system.php
          grep -q "hotteftw1981/TrakFog-Public 🔒" public/system.php
          grep -q "Update-Zugang" public/system.php
          grep -q "dashboard-trakfog-update" public/app.php
          grep -q "TrakFog V.*verfügbar" public/app.php
          grep -q "update_last_check_status" src/UpdateService.php
          grep -q "update_github_token_enc" src/UpdateService.php
          grep -q "triggerUpdate" src/UpdateService.php
          grep -q "X-TrakFog-Updater-Token" src/UpdateService.php
          grep -q "trakfog-updater" docker-compose.yml
          test -s docker/updater/Dockerfile
          test -s docker/updater/updater.py
          grep -q "REPOSITORY = \"hotteftw1981/TrakFog-Public\"" docker/updater/updater.py
          grep -q "_verify_latest_release" docker/updater/updater.py
          ! grep -q "triggerPortainerUpdate" src/UpdateService.php
          ! grep -q "update_portainer_webhook_enc" src/UpdateService.php
          ! grep -q "confirm_stable_reference" public/system.php
          ! grep -q "Portainer Stack-Webhook" public/system.php
          grep -q "update_pending" bin/docker-bootstrap.php
          grep -q "update_last_success_version" bin/docker-bootstrap.php
          grep -q "Advance stable branch" .github/workflows/release.yml
          grep -q 'refs/heads/stable' .github/workflows/release.yml
          test -s docker/DOCKER.md
          grep -q 'refs/heads/stable' docker/PORTAINER.md

      - name: Validate Live Map follow and Tesla cost sync code
        run: |
          grep -q "trakfog-live-map-zoom" public/assets/js/liveview.js
          grep -q "dragging:true" public/assets/js/liveview.js
          grep -q "map.on('dragstart'" public/assets/js/liveview.js
          grep -q "if(mapFollow)" public/assets/js/liveview.js
          grep -q "pointer-events:auto" public/assets/css/liveview.css
          ! grep -q "dragging:false" public/assets/js/liveview.js
          grep -q "touchZoom:'center'" public/assets/js/liveview.js
          grep -q "map.panTo" public/assets/js/liveview.js
          ! grep -q "map.fitBounds(points" public/assets/js/liveview.js
          grep -q "map-workspace" src/View.php
          grep -q "body.map-workspace{height:100dvh;overflow:hidden}" public/assets/css/app.css
          grep -q "body.map-workspace .map-activity-grid{display:none}" public/assets/css/app.css
          grep -q "map.invalidateSize" public/map.php
          grep -q "mapHeatLegendTitle" public/map.php
          grep -q "Lade-Hotspots" public/map.php
          grep -q "routeTripId], 1200" public/live-data.php
          grep -q "getChargingHistoryV2" worker/trakfog_worker/tesla.py
          grep -q "tesla_invoice" worker/trakfog_worker/db.py
          grep -q "tesla_charging_cost_sync_enabled" public/settings.php
          grep -q "software_update" public/app.php
          grep -q "Tesla Deep Data" public/vehicle.php
          grep -q "vehicle_extras" worker/trakfog_worker/tesla.py
          grep -q "tesla_vehicle_extras" worker/trakfog_worker/db.py
          grep -q "lvNerdUpdate" public/assets/js/liveview.js
          grep -q "grid-template-areas:" public/assets/css/liveview.css
          grep -q '"session session"' public/assets/css/liveview.css
          grep -q "leaflet-top.leaflet-left" public/assets/css/liveview.css
          grep -q "lv-position-nav" public/live.php
          grep -q "lv-position-nav" public/assets/css/liveview.css
          grep -q "lvDriveGear" public/live.php
          grep -q "lvPowerRing" public/live.php
          grep -q "lvJourneyChargedEnergy" public/live.php
          grep -q "lv-map-location-toggle" public/live.php
          grep -q "ALLES GESCHLOSSEN" public/assets/js/liveview.js
          ! grep -q 'id="lvNerdTireFL"' public/live.php
          grep -q "CHANGELOG.md" README.md
          grep -q "Kosten-Grundsatz" README.md
          grep -q "nav-group-label" src/View.php
          grep -q 'href="system.php"' src/View.php
          grep -q "System & Verbindung" public/system.php
          grep -q "system-local-nav" public/system.php
          grep -q "dashboard-main" public/app.php
          ! grep -q "TrakFog Engine</span>" src/View.php
          grep -q "kostenpflichtige Fleet API" docs/index.html
          ! grep -q "### 🔜 Nächster Architekturblock" README.md
          ! grep -q "<li>offizielle Tesla Fleet API</li>" public/settings.php
          ! grep -q "V0.1.1.9 — Repository Cleanup" README.md
          test -s docs/index.html

      - name: Validate LiveView JavaScript and metrics
        run: |
          node --check public/assets/js/liveview.js
          node tests/test_liveview_metrics.cjs
          node tests/test_liveview_layout.cjs
          node tests/test_tesla_liveview_breakpoints.cjs
          node tests/test_liveview_telemetry_typography.cjs
          node tests/test_liveview_modes.cjs
          node tests/test_liveview_car_stage.cjs
          node tests/test_liveview_car_assets_v79.cjs
          node tests/test_liveview_showroom_v80.cjs
          node tests/test_showroom_v81.cjs
          node tests/test_vehicle_ground_contact_v82.cjs
          php -l src/TeslaVehicleArt.php
          php -l public/vehicle.php
          php -l public/live-data.php
          php -l public/app.php
          php tests/test_tesla_vehicle_generation.php
          grep -Fq 'vehicle_art_variant' public/vehicle.php
          grep -Fq "'visual' => \$carArt" public/live-data.php
          grep -Fq 'lvSessionEmpty' public/live.php
