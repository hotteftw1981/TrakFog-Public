          docker exec trakfog-web php -r '
            require "/var/www/html/src/bootstrap.php";
            $id="qa-auth-nonexistent-".bin2hex(random_bytes(6));
            for ($n=0; $n<5; $n++) {
                if (Auth::attempt($pdo,$id,"invalid-password")) {
                    throw new RuntimeException("Unknown account unexpectedly authenticated");
                }
            }
            $fingerprint=hash("sha256","__unknown__|cli");
            $stmt=$pdo->prepare("SELECT attempts,blocked_until FROM login_attempts WHERE fingerprint_hash=?");
            $stmt->execute([$fingerprint]);
            $row=$stmt->fetch(PDO::FETCH_ASSOC);
            if (!$row || (int)$row["attempts"]<5 || strtotime((string)$row["blocked_until"]." UTC")<=time()) {
                throw new RuntimeException("Login throttle not persisted");
            }
            if (Auth::attempt($pdo,$id,"invalid-password")) {
                throw new RuntimeException("Blocked account unexpectedly authenticated");
            }
            $pdo->prepare("DELETE FROM login_attempts WHERE fingerprint_hash=?")->execute([$fingerprint]);
            echo "Public Beta login throttle: ok\n";
          '

